# Cloudflare Pages 配置（网页版部署用）
# 面板里看不到「输出目录」时，Cloudflare 会读这个文件兜底。
name = "zhiji-xhs-workbench"
compatibility_date = "2026-09-01"

# 构建产物目录，与 vite.config.mjs 的 build.outDir 一致
pages_build_output_dir = "dist/client"

[build]
# 构建命令：先生成静态快照，再以「网页版」模式打包
command = "npm run build:hosted"

# Node 版本由仓库根目录的 .node-version（22）指定，不需要在这里写
